# Auto-version, tag, and publish a release on every merge to develop.
#
# The version is no longer hand-edited: this workflow derives the next Semantic Version
# from the SCOPE of the conventional-commit messages merged since the last tag (feat →
# minor, fix → patch, "!"/BREAKING CHANGE → major; while 0.x both feat and breaking move
# minor — see RELEASING.md), via go/scripts/nextver. It then rewrites go/version.go +
# CHANGELOG.md, synchronizes Rust, gates both languages, and atomically pushes both tags.
# It commits the version with [skip ci] and publishes
# the GitHub release. A merge whose commits are docs/chore/ci-only releases nothing.
name: release

on:
  push:
    branches: [develop]

permissions:
  contents: write

# Serialize releases so two merges can't race to bump/tag the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Don't re-run on our own "[skip ci]" version-bump commit (belt-and-suspenders: GitHub
    # already skips the run for [skip ci] push events).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Require synchronized inputs before changing the version
        run: make check-generated

      - name: Derive next version from commit scope and apply
        id: bump
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..HEAD}
          echo "commit range: ${range:-<all history>} (last tag: ${last:-none})"
          out=$(git log $range --no-merges --format='%B%x00' \
            | (cd go && go run ./scripts/nextver -apply -dir .. -notes-out "$RUNNER_TEMP/notes.md"))
          next=$(printf '%s\n' "$out" | sed -n 's/^next=//p')
          if [ -z "$next" ]; then
            echo "No releasable change since ${last:-the start}; nothing to do."
            exit 0
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Validate the bumped version (semver + handshake invariants)
        if: ${{ steps.bump.outputs.next }}
        run: |
          make generate
          make gate
          cargo package --manifest-path rust/Cargo.toml --locked --allow-dirty
          python3 scripts/release_checks.py

      - name: Commit the bump, tag, and publish
        if: ${{ steps.bump.outputs.next }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.bump.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go/version.go CHANGELOG.md rust/Cargo.toml rust/Cargo.lock rust/src/version.rs
          git commit -m "chore(release): $tag [skip ci]"
          git tag "$tag"
          git tag "go/$tag"
          git push --atomic origin "HEAD:develop" "refs/tags/$tag" "refs/tags/go/$tag"
          gh release create "$tag" "rust/target/package/oblikovati-api-${{ steps.bump.outputs.next }}.crate" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
