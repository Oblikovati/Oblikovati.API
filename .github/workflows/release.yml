# Auto-version, tag, and publish a release on every merge to develop.
#
# The version is no longer hand-edited: this workflow derives the next Semantic Version
# from the SCOPE of the conventional-commit messages merged since the last tag (feat →
# minor, fix → patch, "!"/BREAKING CHANGE → major; while 0.x both feat and breaking move
# minor — see RELEASING.md), via go/scripts/nextver. It commits a release candidate,
# dispatches the full CI matrix on that exact SHA, then atomically promotes and tags it.
name: release

on:
  push:
    branches: [develop]

permissions:
  contents: write
  actions: write

# Serialize releases so two merges can't race to bump/tag the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Don't re-run on our own "[skip ci]" version-bump commit (belt-and-suspenders: GitHub
    # already skips the run for [skip ci] push events).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@e62c5abf78916697dbc4b25f590deb28f26f5184

      - name: Require MCP annotations for all wire methods
        run: cd go && go test ./client -run '^TestMCPWireAnnotations$'

      - name: Require synchronized inputs before changing the version
        run: make check-generated

      - name: Derive next version from commit scope and apply
        id: bump
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..HEAD}
          echo "commit range: ${range:-<all history>} (last tag: ${last:-none})"
          out=$(git log $range --no-merges --format='%B%x00' \
            | (cd go && go run ./scripts/nextver -apply -dir .. -notes-out "$RUNNER_TEMP/notes.md"))
          next=$(printf '%s\n' "$out" | sed -n 's/^next=//p')
          if [ -z "$next" ]; then
            echo "No releasable change since ${last:-the start}; nothing to do."
            exit 0
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Create a unique committed release candidate
        id: candidate
        if: ${{ steps.bump.outputs.next }}
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          make generate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go/version.go CHANGELOG.md rust/Cargo.toml rust/Cargo.lock rust/src/version.rs
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git commit -m "chore(release): $RELEASE_TAG [skip ci]"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          candidate="api-release-candidate/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sha=$(git rev-parse HEAD)
          echo "branch=$candidate" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python3 scripts/push_release_candidate.py "$GITHUB_SHA" "$sha" "$candidate"
          echo "owned=true" >> "$GITHUB_OUTPUT"

      - name: Verify release package and import metadata
        if: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          cargo package --manifest-path rust/Cargo.toml --locked
          python3 scripts/release_checks.py

      - name: Require the hosted matrix on the candidate commit
        if: ${{ steps.bump.outputs.next }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python3 scripts/release_ci.py "$GITHUB_REPOSITORY" "$CANDIDATE_BRANCH" "$CANDIDATE_SHA"

      - name: Promote the tested commit and publish
        if: ${{ steps.bump.outputs.next }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          RELEASE_VERSION: ${{ steps.bump.outputs.next }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/promote_release.py "$GITHUB_SHA" "$CANDIDATE_SHA" "$RELEASE_TAG"
          python3 scripts/publish_release.py "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" \
            "$RELEASE_TAG" "rust/target/package/oblikovati-api-$RELEASE_VERSION.crate" "$RUNNER_TEMP/notes.md"

      - name: Remove the owned candidate branch
        if: ${{ always() && steps.candidate.outputs.owned == 'true' }}
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$CANDIDATE_SHA" \
            origin ":refs/heads/$CANDIDATE_BRANCH"
